name: prototype-preview

# Builds the clickable PROTOTYPE (sample data, single self-contained page) for review.
# - Every run: downloadable workflow artifact "aenix-prototype" (open index.html in a browser).
# - main: also deployed to GitHub Pages (one-time setup: Settings → Pages → Source: GitHub Actions).
# This is never the production build; production stays deny-by-default (see ci.yml / e2e).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:artifact
      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: aenix-prototype
          path: dist-artifact/site/index.html
          retention-days: 30
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-artifact/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
